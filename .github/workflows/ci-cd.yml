name: Build and push Docker image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE_NAME: deepak2212/cargo-backend

concurrency:
  group: docker-image-release
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image version
        id: version
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME}"
          else
            tags_url="https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/?page_size=100"
            highest_version=0

            while [[ -n "$tags_url" ]]; do
              response=$(curl --fail --silent --show-error \
                --user "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" \
                "$tags_url")

              while read -r tag; do
                if [[ "$tag" =~ ^v[0-9]+$ ]]; then
                  number="${tag#v}"
                  if (( number > highest_version )); then
                    highest_version=$number
                  fi
                fi
              done < <(jq -r '.results[].name' <<< "$response")

              tags_url=$(jq -r '.next // empty' <<< "$response")
            done

            version="v$((highest_version + 1))"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing Docker image version: $version"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


